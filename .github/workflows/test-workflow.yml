name: Test Workflow

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, macos-13, windows-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            **/gradle/libs.versions.toml

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install Chrome (Windows)
        uses: browser-actions/setup-chrome@v2
        if: matrix.os == 'ubuntu-latest'

      - name: Test Code Style
        run: ./gradlew spotlessCheck
        if: matrix.os == 'ubuntu-latest'

      - name: JVM tests
        run: ./gradlew jvmTest
        if: matrix.os == 'ubuntu-latest'

      - name: JS tests
        run: ./gradlew jsTest
        if: matrix.os == 'ubuntu-latest'

      - name: WebAssembly tests
        run: ./gradlew wasmJsTest
        if: matrix.os == 'ubuntu-latest'

      # Tier 1 Native Platform Tests
      - name: Linux x64 tests
        run: ./gradlew linuxX64Test
        if: matrix.os == 'ubuntu-latest'

      - name: macOS x64 tests
        run: ./gradlew macosX64Test
        if: matrix.os == 'macos-13'

      - name: macOS ARM64 tests
        run: ./gradlew macosArm64Test
        if: matrix.os == 'macos-latest'

      - name: iOS Simulator ARM64 tests
        run: ./gradlew iosSimulatorArm64Test
        if: matrix.os == 'macos-latest'

      - name: iOS x64 tests
        run: ./gradlew iosX64Test
        if: matrix.os == 'macos-latest'

      # Tier 2 Native Platform Tests
      - name: watchOS Simulator ARM64 tests
        run: ./gradlew watchosSimulatorArm64Test
        if: matrix.os == 'macos-latest'

      - name: watchOS x64 tests
        run: ./gradlew watchosX64Test
        if: matrix.os == 'macos-latest'

      - name: tvOS Simulator ARM64 tests
        run: ./gradlew tvosSimulatorArm64Test
        if: matrix.os == 'macos-latest'

      - name: tvOS x64 tests
        run: ./gradlew tvosX64Test
        if: matrix.os == 'macos-13'

      # Tier 3 Native Platform Tests
      - name: MinGw X64 tests
        run: ./gradlew mingwX64Test
        if: matrix.os == 'windows-latest'

  coverage:
    if: github.ref == 'refs/heads/main'
    name: Generate Coverage Badge
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Run tests and generate coverage
        run: ./gradlew jvmTest koverXmlReport

      - name: Extract coverage percentage
        id: coverage
        run: |
          # Extract coverage from kover XML report
          COVERAGE=$(grep -o 'line-rate="[0-9.]*"' build/reports/kover/report.xml | head -1 | grep -o '[0-9.]*' | awk '{printf "%.0f", $1 * 100}')
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: Create directory for badges
        run: mkdir -p .github/badges

      - name: Generate coverage badge
        uses: emibcn/badge-action@v2.0.3
        with:
          label: 'Coverage'
          status: '${{ steps.coverage.outputs.coverage }}%'
          color: >-
            ${{
              steps.coverage.outputs.coverage > 90 && 'green'              ||
              steps.coverage.outputs.coverage > 80 && 'yellow'             ||
              steps.coverage.outputs.coverage > 70 && 'orange'             ||
              'red'
            }}
          path: '.github/badges/coverage.svg'

      - name: Commit badge
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/badges/coverage.svg
          git diff --staged --quiet || git commit -m "Update coverage badge"
          git push

