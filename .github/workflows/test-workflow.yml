name: Test Workflow

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, macos-15-intel, windows-latest ]

    steps:
      - uses: actions/checkout@v6

      - name: Cache Konan
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Test Code Style
        run: ./gradlew spotlessCheck
        if: matrix.os == 'ubuntu-latest'

      - name: JVM tests
        run: ./gradlew jvmTest
        if: matrix.os == 'ubuntu-latest'

      - name: JS tests
        run: ./gradlew jsTest
        if: matrix.os == 'ubuntu-latest'

      - name: WebAssembly tests
        run: ./gradlew wasmJsTest
        if: matrix.os == 'ubuntu-latest'

      # Tier 1 Native Platform Tests
      - name: Linux x64 tests
        run: ./gradlew linuxX64Test
        if: matrix.os == 'ubuntu-latest'

      - name: macOS x64 tests
        run: ./gradlew macosX64Test
        if: matrix.os == 'macos-15-intel'

      - name: macOS ARM64 tests
        run: ./gradlew macosArm64Test
        if: matrix.os == 'macos-latest'

      - name: iOS Simulator ARM64 tests
        run: ./gradlew iosSimulatorArm64Test
        if: matrix.os == 'macos-latest'

      - name: iOS x64 tests
        run: ./gradlew iosX64Test
        if: matrix.os == 'macos-latest'

      # Tier 2 Native Platform Tests
      - name: watchOS Simulator ARM64 tests
        run: ./gradlew watchosSimulatorArm64Test
        if: matrix.os == 'macos-latest'

      - name: watchOS x64 tests
        run: ./gradlew watchosX64Test
        if: matrix.os == 'macos-latest'

      - name: tvOS Simulator ARM64 tests
        run: ./gradlew tvosSimulatorArm64Test
        if: matrix.os == 'macos-latest'

      - name: tvOS x64 tests
        run: ./gradlew tvosX64Test
        if: matrix.os == 'macos-15-intel'

      # Tier 3 Native Platform Tests
      - name: MinGw X64 tests
        run: ./gradlew mingwX64Test
        if: matrix.os == 'windows-latest'
