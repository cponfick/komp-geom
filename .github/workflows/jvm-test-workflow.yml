name: JVM Test Workflow

on:
  workflow_call:

jobs:
  jvm-tests:
    name: JVM Tests (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java-version: [ '17', '21', '25' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install test JDK ${{ matrix.java-version }}
        if: matrix.java-version != '17'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      # Install last so Gradle and compilation use Java 17 in every matrix job.
      - name: Set up build JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: JVM tests
        run: ./gradlew jvmTest -PtestJavaVersion=${{ matrix.java-version }}
