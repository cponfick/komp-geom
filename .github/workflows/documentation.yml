name: Release Documentation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to document (for example 0.4.0-rc3)
        required: true
        type: string

# Run this workflow manually after a successful Maven release. The selected tag
# is verified before any release code is checked out or executed.
concurrency:
  group: documentation-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Select and verify release tag
        id: release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]
          git rev-parse --verify "refs/tags/$TAG^{commit}" >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse "refs/tags/$TAG^{commit}")" >> "$GITHUB_OUTPUT"

  build-pages:
    name: Build documentation for GitHub Pages
    needs: release-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-tag.outputs.sha }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build documentation from release commit
        run: ./gradlew dokkaGeneratePublicationHtml
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with: { path: build/dokka/html }

  deploy-pages:
    name: Publish to GitHub Pages
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  docs-build:
    needs: release-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-tag.outputs.sha }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build documentation
        run: ./gradlew dokkaGeneratePublicationHtml
      - name: Upload documentation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-documentation
          path: build/dokka/html
          if-no-files-found: error

  # Only this small publication job receives write credentials, and it consumes an artifact
  # produced by the validated release SHA rather than executing code from that SHA.
  docs-pr:
    needs: [release-tag, docs-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Download documentation artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-documentation
          path: build/dokka/html
      - name: Update documentation branch
        id: update
        env:
          RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          branch="${RELEASE_TAG}-docs"
          git config user.email github-actions[bot]@users.noreply.github.com
          git config user.name github-actions[bot]
          git fetch origin main
          git switch --create "$branch" origin/main
          mkdir -p "docs/dokka/$RELEASE_TAG"
          cp -r build/dokka/html/. "docs/dokka/$RELEASE_TAG/"
          find "docs/dokka/$RELEASE_TAG" -type d -name older -prune -exec rm -rf {} +
          git add "docs/dokka/$RELEASE_TAG"
          if git diff --cached --quiet; then
            echo "No documentation changes for $RELEASE_TAG"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "docs: update documentation after $RELEASE_TAG"
          git push --force-with-lease origin "$branch"
      - name: Check documentation label
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label list --search documentation --json name --jq 'map(select(.name == "documentation")) | length == 1' | grep -qx true
      - name: Create or reuse documentation PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          branch="${RELEASE_TAG}-docs"
          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')"
          if [[ -n "$existing" ]]; then
            echo "Documentation PR #$existing already exists"
          else
            gh pr create --title "docs: update documentation after $RELEASE_TAG" \
              --body "This PR updates versioned documentation for $RELEASE_TAG." \
              --base main --head "$branch" --label documentation
          fi
