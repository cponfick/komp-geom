name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Run every night at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  code-style:
    name: Code Style
    uses: ./.github/workflows/code-style-workflow.yml

  jvm-tests:
    name: JVM Tests
    needs: code-style
    uses: ./.github/workflows/jvm-test-workflow.yml

  platform-tests:
    name: Platform Tests
    needs: code-style
    uses: ./.github/workflows/platform-test-workflow.yml

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: jvm-tests
    # Secrets are not available to forked pull requests; the upload step below
    # is skipped there while the required tests still run.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Run JVM tests and generate coverage
        run: ./gradlew koverXmlReport

      - name: Upload to SonarQube
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --info
