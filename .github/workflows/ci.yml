name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags-ignore:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"
    paths:
      - 'src/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test on different targets
    uses: ./.github/workflows/test-workflow.yml

  coverage:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    name: Generate Coverage Badge
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Run tests and generate coverage
        run: ./gradlew koverXmlReport

      - name: Extract coverage percentage
        id: coverage
        run: |
          # Extract coverage from kover XML report
          COVERAGE=$(grep -o 'line-rate="[0-9.]*"' build/reports/kover/report.xml | head -1 | grep -o '[0-9.]*' | awk '{printf "%.0f", $1 * 100}')
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: Create directory for badges
        run: mkdir -p .github/badges

      - name: Generate coverage badge
        uses: emibcn/badge-action@v2.0.3
        with:
          label: 'Coverage'
          status: '${{ steps.coverage.outputs.coverage }}%'
          color: >-
            ${{
              steps.coverage.outputs.coverage > 90 && 'green'              ||
              steps.coverage.outputs.coverage > 80 && 'yellow'             ||
              steps.coverage.outputs.coverage > 70 && 'orange'             ||
              'red'
            }}
          path: '.github/badges/coverage.svg'

      - name: Commit badge
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/badges/coverage.svg
          git diff --staged --quiet || git commit -m "Update coverage badge"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
