name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags-ignore:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"
    paths:
      - 'src/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ci.yml'
  schedule:
    # Run every night at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  code-style:
    name: Code Style
    uses: ./.github/workflows/code-style-workflow.yml

  jvm-tests:
    name: JVM Tests
    needs: code-style
    uses: ./.github/workflows/jvm-test-workflow.yml

  platform-tests:
    name: Platform Tests
    needs: code-style
    uses: ./.github/workflows/platform-test-workflow.yml

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: jvm-tests
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Run JVM tests and generate coverage
        run: ./gradlew koverXmlReport

      - name: Upload to SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --info
