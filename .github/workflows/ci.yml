name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags-ignore:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [x64]
        include:
          - os: ubuntu-latest
            arch: arm64
          - os: macos-latest
            arch: arm64
          # iOS tests (using macOS runner)
          - os: macos-latest
            arch: x64
            platform: ios
          - os: macos-latest
            arch: arm64
            platform: ios

    steps:
      - uses: actions/checkout@v4
        name: Continuous Integration

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            **/gradle/libs.versions.toml

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Chrome (Windows)
        uses: browser-actions/setup-chrome@v1
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'

      - name: Test Code Style
        run: ./gradlew spotlessCheck
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'

      - name: JVM tests
        run: ./gradlew jvmTest
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'

      - name: JS tests
        run: ./gradlew jsTest
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'

      - name: WebAssembly tests
        run: ./gradlew wasmJsTest
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'

      # Tier 1 Native Platform Tests
      - name: Linux x64 tests
        run: ./gradlew linuxX64Test
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'

      - name: macOS x64 tests
        run: ./gradlew macosX64Test
        if: matrix.os == 'macos-latest' && matrix.arch == 'x64'

      - name: macOS ARM64 tests
        run: ./gradlew macosArm64Test
        if: matrix.os == 'macos-latest' && matrix.arch == 'arm64'

      - name: iOS Simulator ARM64 tests
        run: ./gradlew iosSimulatorArm64Test
        if: matrix.os == 'macos-latest' && matrix.platform == 'ios'

      - name: iOS x64 tests
        run: ./gradlew iosX64Test
        if: matrix.os == 'macos-latest' && matrix.platform == 'ios'

      # Tier 2 Native Platform Tests
      - name: watchOS Simulator ARM64 tests
        run: ./gradlew watchosSimulatorArm64Test
        if: matrix.os == 'macos-latest' && matrix.platform == 'ios'

      - name: watchOS x64 tests
        run: ./gradlew watchosX64Test
        if: matrix.os == 'macos-latest' && matrix.platform == 'ios'

      - name: tvOS Simulator ARM64 tests
        run: ./gradlew tvosSimulatorArm64Test
        if: matrix.os == 'macos-latest' && matrix.platform == 'ios'

      - name: tvOS x64 tests
        run: ./gradlew tvosX64Test
        if: matrix.os == 'macos-latest' && matrix.platform == 'ios'