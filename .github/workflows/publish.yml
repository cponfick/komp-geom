name: Publish

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

concurrency:
  group: "publish"
  cancel-in-progress: false

jobs:
  code-style:
    name: Code Style
    uses: ./.github/workflows/code-style-workflow.yml

  jvm-tests:
    name: JVM Tests
    needs: code-style
    uses: ./.github/workflows/jvm-test-workflow.yml

  platform-tests:
    name: Platform Tests
    needs: code-style
    uses: ./.github/workflows/platform-test-workflow.yml

  publish:
    name: Build and Publish
    runs-on: macos-latest
    needs:
      - jvm-tests
      - platform-tests
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache Konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}

  publish-gh-pages:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    needs:
      - publish
    permissions:
      contents: write
      pages: write
      id-token: write
      pull-requests: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache Konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build documentation with Gradle
        run: ./gradlew dokkaGeneratePublicationHtml

      - name: Upload documentation artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'build/dokka/html'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

      - name: Create branch from main for documentation
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git fetch origin main
          git checkout -b ${{github.ref_name}}-docs origin/main

      - name: Copy to docs
        run: |
          mkdir -p docs/dokka/${{github.ref_name}}
          cp -r build/dokka/html/* docs/dokka/${{github.ref_name}}/
          find . -type d -name "older" -exec rm -rf {} \; 2>/dev/null || true

      - name: Commit, push, and create pr for documentation
        run: |
          git add --all
          git commit -m "docs: update documentation after ${{github.ref_name}}"
          git push origin ${{github.ref_name}}-docs
          gh pr create --title "docs: update documentation after ${{github.ref_name}}" --body "This PR updates the documentation for version ${{github.ref_name}}." --base main --head ${{github.ref_name}}-docs --label documentation
        env:
          GH_TOKEN: ${{ github.token }}
