name: Code Style Workflow

on:
  workflow_call:

jobs:
  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60

      - name: Test Code Style
        run: ./gradlew spotlessCheck
