name: Generate Coverage Badge

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Run tests and generate coverage
        run: ./gradlew jvmTest koverXmlReport

      - name: Extract coverage percentage
        id: coverage
        run: |
          # Extract coverage from kover XML report
          COVERAGE=$(grep -o 'line-rate="[0-9.]*"' build/reports/kover/report.xml | head -1 | grep -o '[0-9.]*' | awk '{printf "%.0f", $1 * 100}')
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: Generate coverage badge
        uses: emibcn/badge-action@v2.0.3
        with:
          label: 'Coverage'
          status: '${{ steps.coverage.outputs.coverage }}%'
          color: >-
            ${{
              steps.coverage.outputs.coverage > 90 && 'green'              ||
              steps.coverage.outputs.coverage > 80 && 'yellow'             ||
              steps.coverage.outputs.coverage > 70 && 'orange'             ||
              'red'
            }}
          path: '.github/badges/coverage.svg'

      - name: Commit badge
        if: github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/badges/coverage.svg
          git diff --staged --quiet || git commit -m "Update coverage badge"
          git push
